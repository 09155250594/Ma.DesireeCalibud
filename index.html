<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For My Favorite Person</title>
  <style>
    :root {
      --bg-image-url: url('https://cdn.phototourl.com/free/2026-07-26-78802b66-00ee-4d48-8d7c-f8833a65fdb5.jpg');
      --card-bg: rgba(255, 255, 255, 0.92);
      --primary-color: #e63946;
      --text-color: #4a4a4a;
      --accent-color: #ffb703;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
    }

    body {
      font-family: 'Georgia', serif;
      background-image: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), var(--bg-image-url);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Card Container */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 35px 25px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
      position: relative;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .heart-icon {
      font-size: 3rem;
      color: var(--primary-color);
      animation: pulse 1.5s infinite;
      display: inline-block;
      margin-bottom: 10px;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    h1 {
      font-size: 1.8rem;
      color: #2b2b2b;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-style: italic;
      color: #666;
      margin-bottom: 25px;
    }

    /* Updated Grid layout for 3 buttons (2 on top, 1 centered below) */
    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      justify-items: center; /* Centers the items horizontally */
    }

    /* Makes the 3rd button span both columns and center itself */
    .button-grid .btn:nth-child(3) {
      grid-column: span 2;
      width: 60%; /* Slightly smaller width for the bottom button for better look */
    }

    /* Styling for the clickable buttons */
    .btn {
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-family: inherit;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 12px rgba(230, 57, 70, 0.3);
      text-decoration: none; 
      display: inline-block;
      width: 100%; /* Fill grid cell */
    }

    .btn:hover {
      background-color: #d62828;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(230, 57, 70, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* Floating Heart Particles */
    #hearts-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .heart-particle {
      position: absolute;
      bottom: -100px;
      font-size: 1.6rem;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 2px 5px rgba(0,0,0,0.3);
      animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Floating Background Particles -->
  <div id="hearts-container"></div>

  <!-- Main Centered Card -->
  <div class="card">
    <div class="heart-icon">💖</div>
    <h1>For My Babyyyyyyyy!!!!!</h1>
    <p class="subtitle">Click the button to see more!!!</p>

    <!-- 3 Clickable Buttons Navigating to Other Pages -->
    <div class="button-grid">
      <button class="btn" onclick="navigateTo(1)">Letter 💌</button>
      <!-- Changed star icon to image icon here -->
      <button class="btn" onclick="navigateTo(2)">Images 🖼️</button>
      <button class="btn" onclick="navigateTo(3)">Flowers 🌸</button>
    </div>
  </div>

  <script>
    // Customize your HTML destination paths here:
    const links = {
      1: "Letter.html",
      2: "Images.html",
      3: "Flowers.html",
    };

    function navigateTo(id) {
      window.location.href = links[id];
    }

    // Floating hearts animation
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart-particle');
      heart.innerHTML = '💖';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 3 + 4 + 's';
      
      document.getElementById('hearts-container').appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 7000);
    }

    setInterval(createHeart, 500);
  </script>
</body>
</html>

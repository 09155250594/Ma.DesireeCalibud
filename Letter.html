<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>For My Favorite Person</title>
  <style>
    :root {
      --bg-image-url: url('https://cdn.phototourl.com/free/2026-07-26-78802b66-00ee-4d48-8d7c-f8833a65fdb5.jpg');
      --card-bg: rgba(255, 255, 255, 0.95);
      --primary-color: #e63946;
      --text-color: #1a1a1a;
      --accent-color: #ffb703;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100svh;
      overflow: hidden;
      -ms-overflow-style: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
    }

    body {
      font-family: 'Georgia', serif;
      background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), var(--bg-image-url);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100svh;
      padding: clamp(14px, 4vw, 24px);
      padding-bottom: max(clamp(14px, 4vw, 24px), env(safe-area-inset-bottom));
      perspective: 1200px;
    }

    /* Fixed Top-Left Back Button */
    .top-left-back-btn {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: max(16px, env(safe-area-inset-left));
      z-index: 100;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #1a1a1a;
      border: 1px solid rgba(255, 255, 255, 0.6);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: all 0.25s ease;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .top-left-back-btn:hover {
      background: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      color: var(--primary-color);
    }

    /* Outer Container Animation */
    .letter-container {
      position: relative;
      background: rgba(255, 248, 240, 0.92);
      padding: clamp(16px, 4vw, 28px);
      border-radius: 26px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
      border: 2px dashed rgba(230, 57, 70, 0.5);
      max-width: 480px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      max-height: calc(100svh - 30px);
      transform-style: preserve-3d;
      animation: paperUnfold 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.27) forwards;
      z-index: 2;
    }

    @keyframes paperUnfold {
      0% {
        opacity: 0;
        transform: rotateX(-90deg) scale(0.6) translateY(-50px);
      }
      60% {
        opacity: 1;
        transform: rotateX(15deg) scale(1.02);
      }
      100% {
        opacity: 1;
        transform: rotateX(0deg) scale(1);
      }
    }

    .letter-container::before {
      content: '';
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 22px solid transparent;
      border-right: 22px solid transparent;
      border-bottom: 16px solid rgba(230, 57, 70, 0.6);
    }

    /* Inner Card */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: clamp(18px, 4vw, 28px) clamp(16px, 4vw, 24px);
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
      position: relative;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-height: 100%;
      overflow-y: auto;
    }

    .heart-icon {
      font-size: clamp(2rem, 5vw, 2.6rem);
      color: var(--primary-color);
      animation: pulse 1.5s infinite;
      display: inline-block;
      margin-bottom: 4px;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    h1 {
      font-size: clamp(1.4rem, 4.5vw, 1.8rem);
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 4px;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    p.subtitle {
      font-style: italic;
      color: #4a4a4a;
      font-size: clamp(0.9rem, 3.2vw, 1.05rem);
      line-height: 1.3;
      margin-bottom: clamp(10px, 2.5vw, 14px);
    }

    /* Page Counter */
    .page-indicator {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary-color);
      background: rgba(230, 57, 70, 0.1);
      padding: 3px 12px;
      border-radius: 12px;
      margin-bottom: 10px;
      display: inline-block;
    }

    /* Letter Flip Stage */
    .letter-deck {
      position: relative;
      width: 100%;
      max-width: 360px;
      height: clamp(600px, 36svh, 300px);
      margin: 0 auto clamp(12px, 2.5vw, 16px) auto;
      perspective: 1000px;
    }

    .letter-page {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
      border: 4px solid #ffffff;
      background: #fff;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
      transform-origin: left center;
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }

    /* Active & Animation States */
    .letter-page.active {
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
      transform: rotateY(0deg) scale(1);
      z-index: 5;
    }

    .letter-page.flipped-out {
      opacity: 0;
      transform: rotateY(-110deg) scale(0.9);
      z-index: 1;
      pointer-events: none;
    }

    .letter-page:hover.active {
      transform: scale(1.02) rotate(-0.5deg);
      box-shadow: 0 12px 25px rgba(230, 57, 70, 0.25);
    }

    .card-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .tap-hint {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 0.75rem;
      padding: 5px 12px;
      border-radius: 14px;
      backdrop-filter: blur(4px);
      pointer-events: none;
    }

    /* Navigation Controls */
    .page-controls {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-bottom: 12px;
    }

    .nav-btn {
      flex: 1;
      background-color: #f1f1f1;
      color: #333;
      border: 1px solid #ddd;
      padding: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn:hover:not(:disabled) {
      background-color: #e2e2e2;
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Buttons Grid */
    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: clamp(8px, 2.5vw, 12px);
      width: 100%;
      justify-items: center;
      margin-top: auto;
    }

    .btn {
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: clamp(10px, 2.5vw, 13px) clamp(12px, 3vw, 16px);
      font-size: clamp(0.85rem, 3vw, 1rem);
      font-weight: 600;
      font-family: inherit;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 14px rgba(230, 57, 70, 0.35);
      text-decoration: none;
      display: inline-block;
      width: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover {
      background-color: #d62828;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(230, 57, 70, 0.45);
    }

    /* Floating Particles */
    #hearts-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .heart-particle {
      position: absolute;
      bottom: -100px;
      font-size: clamp(1.4rem, 4.5vw, 1.8rem);
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 2px 5px rgba(0,0,0,0.3);
      animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Background Music Tag -->
  <audio id="bgMusic" autoplay loop playsinline src="bawat-daan.mp3"></audio>

  <!-- Floating Upper-Left Back Button -->
  <button class="top-left-back-btn" onclick="navigateTo('home')">
    ← Back
  </button>

  <!-- Floating Particles -->
  <div id="hearts-container"></div>

  <!-- Main Card Wrapper -->
  <div class="letter-container" id="letterContainer">
    <div class="card">

      <div class="page-indicator" id="pageIndicator">Page 1 of 4</div>

      <!-- Letter Flip Deck containing Pages 1 - 4 -->
      <div class="letter-deck">
        <!-- Page 1 -->
        <div class="letter-page active" id="page-1" onclick="nextPage()">
          <img src="https://cdn.phototourl.com/free/2026-07-26-60df5ee8-b954-4dba-be9f-4ca83c6cc096.jpg" alt="Letter Page 1" class="card-image" />
          <span class="tap-hint">Tap to flip 💌</span>
        </div>

        <!-- Page 2 -->
        <div class="letter-page" id="page-2" onclick="nextPage()">
          <img src="https://cdn.phototourl.com/free/2026-07-26-fc92678f-9d8b-4055-9171-d731017ca760.jpg" alt="Letter Page 2" class="card-image" />
          <span class="tap-hint">Tap to flip 💌</span>
        </div>

        <!-- Page 3 -->
        <div class="letter-page" id="page-3" onclick="nextPage()">
          <img src="https://cdn.phototourl.com/free/2026-07-26-4a2528a0-8fdc-4e56-8aad-6701b9c5272d.jpg" alt="Letter Page 3" class="card-image" />
          <span class="tap-hint">Tap to flip 💌</span>
        </div>

        <!-- Page 4 -->
        <div class="letter-page" id="page-4" onclick="nextPage()">
          <img src="https://cdn.phototourl.com/free/2026-07-26-99f9345c-d92c-41c9-88bb-f7eb597dbfce.jpg" alt="Letter Page 4" class="card-image" />
          <span class="tap-hint">Start over 🔄</span>
        </div>
      </div>

      <!-- Navigation Controls -->
      <div class="page-controls">
        <button class="nav-btn" id="prevBtn" onclick="prevPage()" disabled>← Previous</button>
        <button class="nav-btn" id="nextBtn" onclick="nextPage()">Next →</button>
      </div>

    </div>
  </div>

  <script>
    const totalPages = 4;
    let currentPage = 1;

    const links = {
      home: "index.html",
      letter: "Letter.html",
      photos: "Images.html",
      flowers: "Flowers.html"
    };

    // Audio & Volume Configuration
    const bgMusic = document.getElementById('bgMusic');
    if (bgMusic) {
      bgMusic.volume = 0.5; // Set audio volume to 50%
    }
    
    function startAudioOnInteraction() {
      if (bgMusic && bgMusic.paused) {
        bgMusic.volume = 0.3; 
        bgMusic.play().catch(() => {
          // Keep silent until user interacts
        });
      }
    }

    // Play music on first tap anywhere if browser blocked initial autoplay
    document.addEventListener('click', startAudioOnInteraction, { once: true });
    document.addEventListener('touchstart', startAudioOnInteraction, { once: true });

    function updatePageDisplay() {
      // Update Page Indicator text
      const indicator = document.getElementById('pageIndicator');
      if (indicator) indicator.innerText = `Page ${currentPage} of ${totalPages}`;

      // Update Pages status
      for (let i = 1; i <= totalPages; i++) {
        const pageEl = document.getElementById(`page-${i}`);
        if (pageEl) {
          pageEl.classList.remove('active', 'flipped-out');

          if (i < currentPage) {
            pageEl.classList.add('flipped-out');
          } else if (i === currentPage) {
            pageEl.classList.add('active');
          }
        }
      }

      // Update button states
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      if (prevBtn) prevBtn.disabled = (currentPage === 1);
      if (nextBtn) nextBtn.innerText = (currentPage === totalPages) ? "Start Over 🔄" : "Next →";
    }

    function nextPage() {
      if (currentPage < totalPages) {
        currentPage++;
      } else {
        currentPage = 1; // Reset to page 1 on last page click
      }
      updatePageDisplay();
    }

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        updatePageDisplay();
      }
    }

    function navigateTo(key) {
      if (links[key]) {
        window.location.href = links[key];
      }
    }

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart-particle');
      heart.innerHTML = '💖';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 3 + 4 + 's';
      
      const container = document.getElementById('hearts-container');
      if (container) {
        container.appendChild(heart);
        setTimeout(() => heart.remove(), 7000);
      }
    }

    setInterval(createHeart, 500);
  </script>
</body>
</html>
